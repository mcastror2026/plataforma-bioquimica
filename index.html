<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F4BDE">
<title>Bioquímica para Enfermería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#app">Saltar al contenido</a>
<main id="app" tabindex="-1"></main>
<footer class="foot">
  <p>Desarrollado por MC · V1.0 · 2026<span id="visitas"></span></p>
  <p class="legal">El recuento de visitas es solo referencial, para conocer el uso del sitio. No usa cookies ni almacena datos personales.</p>
</footer>
<script src="content.js"></script>
<script src="app.js"></script>
<script data-goatcounter="https://mcastror.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<script>
  /* Muestra el total de visitas si GoatCounter lo permite; si no responde, no se muestra nada */
  fetch("https://mcastror.goatcounter.com/counter/TOTAL.json")
    .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
    .then(function (d) {
      if (d && d.count) document.getElementById("visitas").textContent = " · " + d.count + " visitas";
    })
    .catch(function () {});
</script>
</body>
</html>
